<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Monsters - Deck Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/game.css">
    <link rel="stylesheet" href="src/css/deck-select.css">
    <link rel="stylesheet" href="src/css/deck-builder.css">
</head>
<body>
    <div class="builder-container">
        <header class="builder-head">
            <a class="builder-voltar" href="game.html">Voltar ao jogo</a>
            <div>
                <h1>Deck Builder</h1>
                <p class="builder-subtitulo">Monte seu deck (40 cartas) com afinidade, traits e custo.</p>
            </div>
        </header>
        <nav class="builder-abas">
            <button type="button" class="builder-aba ativa" data-aba="construir">Construir</button>
            <button type="button" class="builder-aba" data-aba="meus">Meus decks <span id="builderCustomCount">(0)</span></button>
        </nav>
        <section class="builder-painel-construir" data-painel="construir">
            <div class="builder-colunas">
                <div class="builder-catalogo">
                    <div class="builder-filtros">
                        <input type="search" id="builderBusca" placeholder="Buscar carta..." autocomplete="off">
                        <select id="builderFiltroTipo">
                            <option value="">Todos os tipos</option>
                            <option value="criatura">Criatura</option>
                            <option value="suporte">Suporte</option>
                            <option value="evolução">Evolução</option>
                        </select>
                        <select id="builderFiltroCusto">
                            <option value="">Todos os custos</option>
                            <option value="baixo">Custo 1-3</option>
                            <option value="medio">Custo 4-6</option>
                            <option value="alto">Custo 7+</option>
                        </select>
                        <select id="builderFiltroTrait">
                            <option value="">Todas as traits</option>
                        </select>
                    </div>
                    <div class="builder-grade" id="builderGrade"></div>
                </div>

                <aside class="builder-deck">
                    <div class="builder-deck-topo">
                        <h2>Seu deck <span id="builderTotal">(0/40)</span></h2>
                        <div class="builder-deck-acoes">
                            <button type="button" id="builderLimpar">Limpar</button>
                            <button type="button" id="builderSalvar" disabled>Salvar deck</button>
                        </div>
                    </div>
                    <div class="builder-progresso" id="builderProgresso" role="progressbar"
                         aria-valuemin="0" aria-valuemax="40" aria-valuenow="0">
                        <div class="builder-progresso-barra" id="builderProgressoBarra"></div>
                    </div>
                    <div class="builder-stats" id="builderStats"></div>
                    <div class="builder-afinidades" id="builderAfinidades"></div>
                    <div class="builder-traits" id="builderTraits"></div>
                    <div class="builder-lista" id="builderLista"></div>
                    <form class="builder-form" id="builderForm">
                        <h2>Identidade do deck</h2>
                        <label>Nome<input id="builderNome" maxlength="40" placeholder="Ex: Furia Selvagem" required></label>
                        <label>Tema<input id="builderTema" placeholder="Ex: Feras velozes"></label>
                        <label>Descricao<textarea id="builderDescricao" rows="3" placeholder="Plano de jogo..."></textarea></label>
                        <div class="builder-cores">
                            <label>Primaria<input type="color" id="builderCorPrimaria" value="#d4af37"></label>
                            <label>Secundaria<input type="color" id="builderCorSecundaria" value="#1a1e28"></label>
                            <label>Acento<input type="color" id="builderCorAcento" value="#f8fafc"></label>
                        </div>
                        <fieldset class="builder-traits-form">
                            <legend><button type="button" id="builderTraitsToggle" aria-expanded="true">Traits do tema ▾</button></legend>
                            <div id="builderTraitsForm"></div>
                        </fieldset>
                        <fieldset class="builder-emblema">
                            <legend><button type="button" id="builderEmblemaToggle" aria-expanded="true">Emblema ▾</button></legend>
                            <div class="builder-emblema-corpo" id="builderEmblemaCorpo">
                                <div class="builder-emoji-grade" id="builderEmojiGrade"></div>
                                <label>Ou digite<input id="builderEmblema" maxlength="8" value="🃏"></label>
                            </div>
                        </fieldset>
                        <p class="builder-erro" id="builderErro" hidden></p>
                        <p class="builder-ok" id="builderOk" hidden></p>
                    </form>
                </aside>

                <aside class="builder-preview">
                    <div class="builder-preview-topo">
                        <h2>Prévia</h2>
                        <span class="builder-subtitulo">como aparece na listagem</span>
                    </div>
                    <div class="builder-preview-listagem" id="builderPreviewListagem"></div>
                </aside>
            </div>
        </section>
        <section class="builder-painel-meus" data-painel="meus" hidden>
            <h2>Meus decks</h2>
            <div class="builder-meus-lista" id="builderMeusLista"></div>
        </section>
    </div>
    <div class="game-dialog-modal" id="gameDialogModal">
        <div class="game-dialog-card">
            <button class="modal-close" onclick="closeGameDialog()">&times;</button>
            <div class="game-dialog-icon" id="gameDialogIcon">⚠️</div>
            <h3 class="game-dialog-title" id="gameDialogTitle">Aviso</h3>
            <div class="game-dialog-message" id="gameDialogMessage"></div>
            <div class="game-dialog-actions" id="gameDialogActions">
                <button class="game-dialog-btn game-dialog-btn-primary" id="gameDialogConfirmBtn" onclick="confirmGameDialog()">OK</button>
                <button class="game-dialog-btn game-dialog-btn-cancel" id="gameDialogCancelBtn" onclick="closeGameDialog()" style="display: none;">Cancelar</button>
            </div>
        </div>
    </div>
    <script src="src/js/game-state.js"></script>
    <script src="src/js/game-engine.js"></script>
    <script src="src/js/card-rules.js"></script>
    <script src="src/js/card-abilities.js"></script>
    <script src="src/js/deck_system.js"></script>
    <script src="src/js/deck-select.js"></script>
    <script src="src/js/deck-builder.js"></script>
</body>
</html>
